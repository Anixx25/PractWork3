name: Отчет о дефекте
description: Шаблон для оформления отчета об ошибке в приложении
title: "[Ошибка]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Спасибо за заполнение отчета о дефекте!
        Пожалуйста, опишите проблему максимально подробно.

  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Кратко опишите суть проблемы
      placeholder: Например, при нажатии на кнопку "Сохранить" приложение падает
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: Предусловия
      description: Что должно быть выполнено до воспроизведения бага
      placeholder: Например, пользователь авторизован, открыт раздел "Настройки"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Пошаговая инструкция для воспроизведения дефекта
      placeholder: |
        1. Открыть главную страницу
        2. Нажать на кнопку "Войти"
        3. Ввести некорректный пароль
        4. Нажать "Отправить"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      description: Как должно работать приложение
      placeholder: Например, должно появиться сообщение "Неверный пароль"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: Как работает приложение на самом деле
      placeholder: Например, приложение закрывается без сообщения об ошибке
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Скриншоты / Доп. материалы
      description: Прикрепите скриншоты, видео, логи
      placeholder: Перетащите файлы сюда или вставьте ссылки
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      description: Насколько срочно нужно исправить дефект
      options:
        - Низкий
        - Средний
        - Высокий
        - Критический
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Серьезность
      description: Насколько сильно дефект влияет на работу приложения
      options:
        - Trivial (косметический)
        - Minor (незначительный)
        - Major (значительный)
        - Critical (критический)
        - Blocker (блокирующий)
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Подтверждение
      description: Перед отправкой убедитесь, что выполнены условия
      options:
        - label: Я ознакомился с уже существующими отчетами о дефектах и не нашел дубликата
          required: true
        - label: Я заполнил все обязательные поля отчета
          required: true
